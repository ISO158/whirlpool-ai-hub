steps:
  # 1. Build da imagem Docker com a tag do commit do Git
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/whirlpool-ai-portal:$COMMIT_SHA'
      - '.'

  # 2. Envio da imagem para o Artifact Registry do GCP
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/whirlpool-ai-portal:$COMMIT_SHA'

  # 3. Deploy da nova revisão no Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'whirlpool-ai-portal'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/whirlpool-ai-portal:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/whirlpool-ai-portal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
